name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Fails (no fallback) if 3.14 can't be provided.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tools/mcp_serial/requirements.txt

      - name: Confirm Python 3.14
        run: python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 14), sys.version"

      - name: Install dependencies
        run: python -m pip install -r tools/mcp_serial/requirements.txt

      - name: Run tests
        run: pytest tools/mcp_serial
