; ESP32 dev board (ESP32-WROOM-32) + MPU-6050 accelerometer streaming firmware.

[env:esp32dev]
; Pinned to the 6.x platform, which ships Arduino core 2.0.x. Core 3.x changed
; the hardware-timer API (timerBegin(freq) / timerAlarm), and main.cpp uses the 2.x API.
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
